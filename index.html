      #loading-screen {

        direction: rtl;
      }

    </div>

    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Unregister any active service worker if registration was disabled
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }

      // Remove loading screen when app is ready or after timeout fallback
      const hideLoader = () => {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
      };

      window.addEventListener('load', hideLoader);
      // Fallback: hide loader after 5 seconds even if load event didn't fire correctly
      setTimeout(hideLoader, 5000);
    </script>
  </body>
